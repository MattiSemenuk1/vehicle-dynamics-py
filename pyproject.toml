[project]
name = "vehicle-dynamics-py"
version = "0.1.0"
description = "Creating simple bicycle model as test and memory refreshment"
readme = "README.md"
authors = [
    { email = "first.last@semaq.fi" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "scipy>=1.18.1",
]

[project.scripts]
vehicle-dynamics-py = "vehicle_dynamics_py:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
